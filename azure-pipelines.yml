trigger:
  branches:
    include:
      - main

variables:
  buildConfiguration: Release
  terraformWorkingDirectory: infra/terraform

stages:
- stage: BuildAndTest
  displayName: Build and Test
  jobs:
  - job: DotNet
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 8.0.x
    - script: dotnet restore UsagePulse.slnx
      displayName: Restore
    - script: dotnet build UsagePulse.slnx -c $(buildConfiguration) --no-restore
      displayName: Build
    - script: dotnet test UsagePulse.slnx -c $(buildConfiguration) --no-build --collect "XPlat Code Coverage"
      displayName: Test

- stage: InfrastructurePlan
  displayName: Terraform Plan
  jobs:
  - job: Plan
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 1.9.8
    - script: terraform -chdir=$(terraformWorkingDirectory) init
      displayName: Terraform Init
    - script: terraform -chdir=$(terraformWorkingDirectory) validate
      displayName: Terraform Validate
    - script: terraform -chdir=$(terraformWorkingDirectory) plan -out=tfplan
      displayName: Terraform Plan

- stage: Deploy
  displayName: Deploy to Azure
  dependsOn:
  - BuildAndTest
  - InfrastructurePlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployUsagePulse
    environment: usagepulse-prod
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 1.9.8
          - script: terraform -chdir=$(terraformWorkingDirectory) init
            displayName: Terraform Init
          - script: terraform -chdir=$(terraformWorkingDirectory) apply -auto-approve tfplan
            displayName: Terraform Apply
